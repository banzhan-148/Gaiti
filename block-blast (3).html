  --bg1:#1d2658;--bg2:#070a1a;--panel:#121840;--boardbg:#0c1130;--ring:#2c377c;--e1:#171f4d;--e2:#1b2559;

[data-app=light]{--veil:rgba(255,255,255,.08);--bg1:#f1f5ff;--bg2:#b9c9fb;--panel:#ffffff;--boardbg:#8197de;--ring:#5d77d2;--e1:#c5d1f8;--e2:#b6c5f4;
  --text:#1b2358;--muted:#5a6698;--accent:#d97706;--slot:rgba(60,80,170,.12);--btn:rgba(40,60,160,.12);--over:rgba(235,240,255,.92);--card:#eef2ff}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;color:var(--text);
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  background:radial-gradient(120% 75% at 50% 0,var(--bg1),var(--bg2));transition:background .4s}
body{background:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;display:none;
  background:linear-gradient(var(--veil),var(--veil)),var(--bgimg) center 20%/cover no-repeat}
[data-bg=on] body::before{display:block}
[data-bg=on] .top{padding:10px 14px;border-radius:18px;background:rgba(8,12,34,.58)}
[data-bg=on] #board{background:rgba(8,12,34,.3)}
[data-bg=on] .cell:not([class*=t-]){background:rgba(8,12,34,.4)}
[data-bg=on] .cell.alt:not([class*=t-]){background:rgba(8,12,34,.24)}
[data-bg=on] .slot{background:rgba(8,12,34,.5)}
[data-bg=on][data-app=light] .top{background:rgba(255,255,255,.7)}
[data-bg=on][data-app=light] #board{background:rgba(255,255,255,.22)}
[data-bg=on][data-app=light] .cell:not([class*=t-]){background:rgba(40,60,160,.26)}
[data-bg=on][data-app=light] .cell.alt:not([class*=t-]){background:rgba(40,60,160,.14)}
[data-bg=on][data-app=light] .slot{background:rgba(255,255,255,.55)}
[data-app=dark] .top{text-shadow:0 2px 10px rgba(0,0,0,.6)}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.top{width:var(--b);display:flex;justify-content:space-between;align-items:flex-end}
.lbl{font-size:12px;color:var(--muted);font-weight:700}
#score{font-size:44px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.right{display:flex;align-items:flex-end;gap:8px}
.best{text-align:right;margin-right:4px}
#best{font-size:22px;font-weight:900;color:var(--accent)}
.icon{width:42px;height:42px;border:0;border-radius:14px;background:var(--btn);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:transform .12s}
.icon:active{transform:scale(.92)}
.wrap{position:relative}
#board{width:var(--b);height:var(--b);display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);gap:2px;padding:4px;
  background:var(--boardbg);border-radius:18px;box-shadow:0 0 0 3px var(--ring),0 18px 36px rgba(0,0,0,.35);transition:background .4s}
.cell{border-radius:18%;background:var(--e1)}
.cell.alt{background:var(--e2)}
.cell.g{opacity:.55}
.cell.w{filter:brightness(1.3) drop-shadow(0 0 6px #fff)}
.cell.drop{animation:drop .18s ease-out}
.cell.pop{animation:pop .3s ease-in forwards}
@keyframes drop{from{transform:scale(.7)}to{transform:scale(1)}}
@keyframes pop{40%{transform:scale(1.15);filter:brightness(1.6)}100%{transform:scale(0);opacity:0}}

/* ---------- стили блоков ---------- */
.cell.t-candy{border-radius:26%;background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.75) 0 12%,transparent 14%),linear-gradient(165deg,color-mix(in srgb,var(--col) 78%,#fff),var(--col) 50%,color-mix(in srgb,var(--col) 78%,#000));
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.5),0 2px 3px rgba(0,0,0,.25)}
.cell.t-neon{border-radius:20%;background:color-mix(in srgb,var(--col) 22%,#0b0e22);border:2px solid var(--col);
  box-shadow:0 0 10px color-mix(in srgb,var(--col) 80%,transparent),inset 0 0 10px color-mix(in srgb,var(--col) 55%,transparent)}
.cell.t-gem{border-radius:16%;background:conic-gradient(from 45deg,color-mix(in srgb,var(--col) 80%,#fff) 0 25%,color-mix(in srgb,var(--col) 62%,#000) 0 50%,color-mix(in srgb,var(--col) 45%,#fff) 0 75%,color-mix(in srgb,var(--col) 25%,#fff) 0 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.38),0 2px 4px rgba(0,0,0,.3)}
.cell.t-wood{border-radius:12%;background:repeating-linear-gradient(95deg,rgba(0,0,0,.1) 0 2px,transparent 2px 6px),linear-gradient(180deg,color-mix(in srgb,var(--col) 85%,#fff),var(--col));
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.2),inset 0 3px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.25)}
.cell.t-pixel{border-radius:0;background:var(--col);box-shadow:inset 3px 3px 0 rgba(255,255,255,.45),inset -3px -3px 0 rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.55)}
.cell.t-glass{border-radius:24%;background:linear-gradient(145deg,rgba(255,255,255,.8),rgba(255,255,255,.12) 45%,transparent 60%),color-mix(in srgb,var(--col) 80%,transparent);
  border:1.5px solid rgba(255,255,255,.7);box-shadow:inset 0 -3px 6px rgba(0,0,0,.18),0 2px 6px color-mix(in srgb,var(--col) 60%,transparent)}
.pc{display:grid}
.pc .cell.e{visibility:hidden}

#tray{width:var(--b);display:flex;justify-content:space-between;touch-action:none}
.slot{width:calc(var(--b)/3 - 6px);height:calc(var(--c)*3);display:flex;align-items:center;justify-content:center;
  background:var(--slot);border-radius:18px;cursor:grab;touch-action:none}
.slot.dead>div{opacity:.3}
.float{position:fixed;z-index:50;pointer-events:none;filter:drop-shadow(0 10px 8px rgba(0,0,0,.4))}
#toast{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:30px;font-weight:900;pointer-events:none;opacity:0;
  color:#ffe066;text-shadow:0 3px 0 #b45309,0 0 18px #ff9f43;padding:0 10px}
#toast.show{animation:toast 1.4s ease-out}
@keyframes toast{0%{opacity:0;transform:scale(.5)}15%{opacity:1;transform:scale(1.12)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-30px)}}

#over{position:absolute;inset:0;border-radius:18px;background:var(--over);display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;backdrop-filter:blur(3px)}
#over.on{display:flex}
#over h2{margin:0;font-size:30px}
#over .big{font-size:60px;font-weight:900;color:var(--accent);line-height:1}
.cta{margin-top:12px;border:0;border-radius:16px;padding:14px 32px;font-size:18px;font-weight:900;font-family:inherit;color:#fff;background:linear-gradient(#34d27b,#17a35a);box-shadow:0 5px 0 #0d6b3b;cursor:pointer}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #0d6b3b}

/* ---------- настройки ---------- */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
.modal.on{display:flex}
.sheet{width:min(92vw,400px);max-height:92vh;overflow:auto;background:var(--panel);border-radius:24px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sh-head h3{margin:0;font-size:22px}
.sec{margin-top:18px}
.sl{font-weight:800;font-size:14px;margin-bottom:8px}
.hint{font-size:12px;color:var(--muted);margin-top:2px;max-width:260px}
.seg{display:flex;background:var(--btn);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:800;font-size:14px;padding:10px 0;border-radius:11px;cursor:pointer}
.seg button.on{background:var(--accent);color:#1b1b1b}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tcard{border:0;background:var(--card);color:var(--text);border-radius:16px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;font:inherit;font-weight:800;font-size:13px;cursor:pointer;outline:2px solid transparent}
.tcard.on{outline-color:var(--accent)}
.pv{display:grid;grid-template-columns:repeat(3,24px);grid-auto-rows:24px;gap:3px;padding:5px;border-radius:10px;background:var(--e1)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sw{flex:none;width:54px;height:32px;border:0;border-radius:16px;background:var(--btn);position:relative;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}
.sw.on{background:#2ed573}.sw.on::after{transform:translateX(22px)}
input{-webkit-user-select:text;user-select:text}
.bar{width:var(--b);display:flex;justify-content:space-between;gap:8px;margin-top:-4px}
.chip{display:flex;align-items:center;gap:8px;border:0;border-radius:14px;padding:6px 12px 6px 6px;background:var(--btn);color:var(--text);font:inherit;font-weight:800;font-size:14px;cursor:pointer;max-width:62%}
.chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:active{transform:scale(.96)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ffb347,#ff5d73);color:#fff;font-size:14px;font-weight:900;flex:none}
[data-bg=on] .chip{background:rgba(8,12,34,.58)}
[data-bg=on][data-app=light] .chip{background:rgba(255,255,255,.7)}
.sheet{touch-action:pan-y}
.fld{width:100%;margin-top:10px;padding:13px 14px;border:2px solid transparent;border-radius:14px;background:var(--btn);color:var(--text);font:inherit;font-size:16px;outline:none}
.fld:focus{border-color:var(--accent)}
.err{color:#ff6b6b;font-size:13px;font-weight:700;min-height:18px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted);font-weight:700}
.lb{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:52vh;overflow:auto;touch-action:pan-y}
.lbr{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;padding:9px 10px;border-radius:12px;background:var(--card);font-weight:800}
.lbr.me{outline:2px solid var(--accent)}
.lbr small{display:block;color:var(--muted);font-weight:700;font-size:11px}
.lbr .sc2{font-variant-numeric:tabular-nums;color:var(--accent);font-size:18px}
.cta.alt{background:var(--btn);box-shadow:none;color:var(--text);margin-top:8px}
.cta.wide{width:100%;margin-top:6px}
@media (prefers-reduced-motion:reduce){.cell.pop,.cell.drop,#toast.show{animation-duration:.01s}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div><div class="lbl">Счёт</div><div id="score">0</div></div>
    <div class="right">
      <div class="best"><div class="lbl">👑 Рекорд</div><div id="best">0</div></div>
      <button class="icon" id="restart" title="Заново" aria-label="Заново"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4h-4"/></svg></button>
      <button class="icon" id="openS" title="Настройки" aria-label="Настройки"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>

    <div id="over"><h2>Игра окончена</h2><div class="lbl">Ваш счёт</div><div class="big" id="fs">0</div><div id="nb" class="lbl"></div><div id="lbNote" class="lbl" style="color:var(--text)"></div><button class="cta" id="again">Играть снова</button><button class="cta alt" id="goLB">🏆 Рейтинг</button></div>

<div class="modal" id="settings">
  <div class="sheet">
    <div class="sh-head"><h3>Настройки</h3><button class="icon" id="closeS" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="sec"><div class="sl">Тема приложения</div>
      <div class="seg" id="segApp"><button data-v="dark">Тёмная</button><button data-v="light">Светлая</button><button data-v="auto">Авто</button></div></div>
    <div class="sec"><div class="sl">Стиль блоков</div><div class="tg" id="themeGrid"></div></div>
    <div class="sec row"><div><div class="sl" style="margin:0">Менять стиль на чистом поле</div><div class="hint">Когда поле полностью очищено, блоки получают следующий стиль.</div></div><button class="sw" id="autoSw" role="switch" aria-label="Автосмена стиля"></button></div>
    <div class="sec row"><div><div class="sl" style="margin:0">Фоновая картинка</div><div class="hint">Показывать фото за игровым полем.</div></div><button class="sw" id="bgSw" role="switch" aria-label="Фоновая картинка"></button></div>
  </div>
</div>

<div class="modal" id="authM"><div class="sheet">
  <div class="sh-head"><h3 id="authT">Аккаунт</h3><button class="icon" data-close aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="authIn">
    <div class="seg" id="authTabs" style="margin-top:10px"><button data-v="login" class="on">Вход</button><button data-v="reg">Регистрация</button></div>
    <input class="fld" id="fName" placeholder="Никнейм" maxlength="16" autocomplete="username" autocapitalize="off" spellcheck="false">
    <input class="fld" id="fPass" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password">
    <input class="fld" id="fPass2" type="password" placeholder="Повторите пароль" autocomplete="new-password" style="display:none">
    <div class="err" id="authErr"></div>
    <button class="cta wide" id="authGo">Войти</button>
  </div>
  <div id="authOut" style="display:none">
    <div style="display:flex;align-items:center;gap:12px;margin-top:12px"><span class="av" style="width:48px;height:48px;font-size:22px" id="pAv">★</span><b style="font-size:22px" id="pName"></b></div>
    <div class="stats"><div class="stat"><b id="pBest">0</b><span>Рекорд</span></div><div class="stat"><b id="pGames">0</b><span>Игр</span></div><div class="stat"><b id="pRank">—</b><span>Место</span></div></div>
    <button class="cta alt wide" id="logout">Выйти</button>

  <div class="sh-head"><h3>🏆 Рейтинг</h3><button class="icon" data-close aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="hint" id="lbMode" style="max-width:none"></div>
  <div class="lb" id="lbList"></div>
</div></div>

<script>
const N=8;
const THEMES=[
 {id:'candy',name:'Конфеты',cols:['#ff5d73','#ff9f43','#ffd23f','#3ddc84','#35a7ff','#a66cff','#ff7ad9']},
 {id:'neon', name:'Неон',cols:['#ff2e63','#ff9f1c','#f9f871','#00f5a0','#00d4ff','#9d4dff','#ff4dd2']},
 {id:'gem',  name:'Самоцветы',cols:['#e0245e','#f08c00','#e6c200','#12b886','#1c7ed6','#7048e8','#d6336c']},
 {id:'wood', name:'Дерево',cols:['#c0603a','#d9a441','#8a9a5b','#5f7a8a','#9b5d73','#7a5230','#c98a4b']},
 {id:'pixel',name:'Пиксели',cols:['#e52521','#fb9b1e','#f8d800','#00a800','#0058f8','#6844fc','#d800cc']},
 {id:'glass',name:'Стекло',cols:['#ff7a90','#ffb36b','#ffe27a','#6ee7a8','#6cc4ff','#b496ff','#ff9be5']}
];
const BASES=[["1"],["11"],["111"],["1111"],["11111"],["11","11"],["111","111","111"],["111","111"],
 ["10","11"],["100","100","111"],["110","011"],["011","110"],["111","010"],["10","10","11"],["01","01","11"]];
const rot=m=>m[0].map((_,c)=>m.map(r=>r[c]).reverse());
const SHAPES=[];
BASES.forEach(b=>{let m=b.map(r=>[...r].map(Number)),seen=new Set();
  for(let i=0;i<4;i++){const k=JSON.stringify(m);if(!seen.has(k)){seen.add(k);SHAPES.push(m)}m=rot(m)}});

const $=id=>document.getElementById(id);
const boardEl=$('board'),trayEl=$('tray');
let board,pieces,score,best=0,streak,busy,over,drag=null,lastKey='';
let S={app:'dark',theme:'candy',auto:true,bg:true};
try{best=+localStorage.getItem('bb_best')||0;Object.assign(S,JSON.parse(localStorage.getItem('bb_set')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('bb_set',JSON.stringify(S))}catch(e){}};
const TH=()=>THEMES.find(t=>t.id===S.theme)||THEMES[0];

const cells=[];
for(let i=0;i<N*N;i++){const d=document.createElement('div');d.className='cell';boardEl.appendChild(d);cells.push(d)}
for(let i=0;i<3;i++){const s=document.createElement('div');s.className='slot';s.dataset.i=i;trayEl.appendChild(s)}

const fits=(m,r,c)=>m.every((row,y)=>row.every((v,x)=>!v||(r+y>=0&&r+y<N&&c+x>=0&&c+x<N&&!board[r+y][c+x])));
const canPlace=m=>{for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(fits(m,r,c))return true;return false};
const rnd=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- умный генератор фигур ---------- */
const INFO=SHAPES.map((m,id)=>({id,m,h:m.length,w:m[0].length,n:m.flat().reduce((a,b)=>a+b),mask:m.map(row=>row.reduce((a,v,x)=>a|(v<<x),0))}));
const boardRows=()=>board.map(r=>r.reduce((a,v,x)=>a|((v?1:0)<<x),0));
function tryPlace(rows,p,r,c){
  for(let y=0;y<p.h;y++)if(rows[r+y]&(p.mask[y]<<c))return null;
  const nr=rows.slice();
  for(let y=0;y<p.h;y++)nr[r+y]|=p.mask[y]<<c;
  let colAnd=255,lines=0;
  for(let i=0;i<8;i++)colAnd&=nr[i];
  for(let b=colAnd;b;b&=b-1)lines++;
  for(let i=0;i<8;i++){if(nr[i]===255){lines++;nr[i]=0}else nr[i]&=~colAnd&255}
  return {rows:nr,lines};
}
let nodes=0;
/* ищет порядок и места, при которых помещаются ВСЕ фигуры (с учётом очистки линий между ходами) */
function solve(rows,rem,got,need,seen,lim){
  if(!rem.length)return (!need||got)?[]:null;
  if(++nodes>lim)return null;
  const key=rows.join()+'|'+rem.map(p=>p.id).sort().join()+(got?1:0);
  if(seen.has(key))return null;seen.add(key);
  for(let i=0;i<rem.length;i++){
    const p=rem[i],rest=rem.filter((_,j)=>j!==i);
    for(let r=0;r<=8-p.h;r++)for(let c=0;c<=8-p.w;c++){
      const res=tryPlace(rows,p,r,c);if(!res)continue;
      const tail=solve(res.rows,rest,got||res.lines>0,need,seen,lim);
      if(tail)return [{p,r,c},...tail];
    }
  }
  return null;
}
function pickShape(f){
  const k=Math.max(0,(f-.3)*3);let tot=0;
  const w=INFO.map(s=>{const x=Math.pow(s.n,-k);tot+=x;return x});
  let r=Math.random()*tot;
  for(let i=0;i<INFO.length;i++){r-=w[i];if(r<=0)return INFO[i]}
  return INFO[0];
}
function genTray(){
  const rows=boardRows();let filled=0;
  rows.forEach(r=>{for(let b=r;b;b&=b-1)filled++});
  const f=filled/64;let ok=null;
  for(let pass=0;pass<2&&!ok;pass++){
    const t0=performance.now();let fb=null;
    for(let t=0;t<80;t++){
      if(performance.now()-t0>60)break;
      const set=[0,1,2].map(()=>pickShape(pass?1:f));
      if(set[0]===set[1]&&set[1]===set[2]&&f<.6)continue;
      nodes=0;
      if(!solve(rows,set,false,false,new Set(),4000))continue;
      if(f<.4){ok=set;break}
      nodes=0;
      if(solve(rows,set,false,true,new Set(),1500)){ok=set;break}
      fb=fb||set;
    }
    if(!ok&&fb)ok=fb;
  }
  if(!ok){let bc=-1;for(let t=0;t<60;t++){const set=[0,1,2].map(()=>pickShape(1));const c=set.filter(p=>canPlace(p.m)).length;if(c>bc){bc=c;ok=set}}}
  return ok.map(s=>({m:s.m,c:Math.floor(Math.random()*7)}));
}
function newTray(){pieces=genTray()}
function fullLines(b){
  const rows=[],cols=[];
  for(let k=0;k<N;k++){if(b[k].every(Boolean))rows.push(k);if(b.every(r=>r[k]))cols.push(k)}
  return {rows,cols};
}
function renderBoard(){
  const T=TH();
  cells.forEach((el,i)=>{const r=i>>3,c=i&7,v=board[r][c];
    el.className='cell'+((r+c)&1?' alt':'')+(v?' f t-'+T.id:'');
    if(v)el.style.setProperty('--col',T.cols[v-1]);});
}
function mk(m,color,cs,gap,T=TH()){
  const g=document.createElement('div');g.className='pc';
  g.style.gridTemplateColumns=`repeat(${m[0].length},${cs}px)`;g.style.gridAutoRows=cs+'px';g.style.gap=gap+'px';
  m.forEach(row=>row.forEach(v=>{const d=document.createElement('div');d.className='cell '+(v?'f t-'+T.id:'e');
    if(v)d.style.setProperty('--col',T.cols[color]);g.appendChild(d)}));
  return g;
}
function metrics(){
  const a=cells[0].getBoundingClientRect(),b=cells[1].getBoundingClientRect();
  return {x:a.left,y:a.top,p:b.left-a.left};
}
function renderTray(){
  const {p}=metrics();
  [...trayEl.children].forEach((s,i)=>{
    s.innerHTML='';const pc=pieces[i];
    s.classList.toggle('dead',!!pc&&!canPlace(pc.m));
    if(pc)s.appendChild(mk(pc.m,pc.c,Math.floor(p*0.5)-1,2));
  });
}
function setScore(v){score=v;$('score').textContent=v;
  if(v>best){best=v;$('best').textContent=v;try{localStorage.setItem('bb_best',v)}catch(e){}}}
function toast(t){const el=$('toast');el.textContent=t;el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}

function start(){
  commit();committed=false;
  board=Array.from({length:N},()=>Array(N).fill(0));
  streak=0;busy=false;over=false;$('over').classList.remove('on');
  setScore(0);$('best').textContent=best;
  newTray();renderBoard();renderTray();
}

function place(i,r,c){
  const p=pieces[i];busy=true;
  let n=0;const placed=[];
  p.m.forEach((row,y)=>row.forEach((v,x)=>{if(v){board[r+y][c+x]=p.c+1;n++;placed.push((r+y)*N+c+x)}}));
  pieces[i]=null;renderBoard();renderTray();
  placed.forEach(idx=>cells[idx].classList.add('drop'));
  const {rows,cols}=fullLines(board),L=rows.length+cols.length;
  let gain=n;
  if(L){
    streak++;
    gain+=10*L*L*streak;
    const kill=new Set();
    rows.forEach(k=>{for(let x=0;x<N;x++)kill.add(k*N+x)});
    cols.forEach(k=>{for(let y=0;y<N;y++)kill.add(y*N+k)});
    kill.forEach(idx=>{cells[idx].classList.remove('drop');cells[idx].classList.add('pop')});
    setTimeout(()=>{
      kill.forEach(idx=>board[idx>>3][idx&7]=0);
      let msg=streak>1?`Комбо ×${streak}!`:(L>1?`${L} линии!`:'');
      if(board.every(r=>r.every(v=>!v))){
        gain+=200;msg='Идеально! +200';
        if(S.auto){const nx=THEMES[(THEMES.indexOf(TH())+1)%THEMES.length];setBlockTheme(nx.id,true);msg+='\nСтиль: '+nx.name}
      }
      if(msg){toast(msg);$('toast').style.whiteSpace='pre-line'}
      setScore(score+gain);renderBoard();finish();
    },300);
  }else{
    streak=0;setScore(score+gain);finish();
  }
}
function finish(){
  if(pieces.every(p=>!p))newTray();
  renderTray();busy=false;
  if(!pieces.some(p=>p&&canPlace(p.m))){
    over=true;const pr=commit();
    setTimeout(async()=>{$('fs').textContent=score;
      $('nb').textContent=score>=best&&score>0?'Новый рекорд!':'Рекорд: '+best;
      $('lbNote').textContent=acct?'':'Войдите, чтобы попасть в рейтинг';
      $('over').classList.add('on');
      const r=await pr;if(r&&r.rank)$('lbNote').textContent='Ваше место в рейтинге: '+r.rank},350);
  }
}

/* ---------- перетаскивание ---------- */
trayEl.addEventListener('pointerdown',e=>{
  if(busy||over||drag)return;
  const s=e.target.closest('.slot');if(!s)return;
  const i=+s.dataset.i,pc=pieces[i];if(!pc)return;
  const {p}=metrics();
  const el=mk(pc.m,pc.c,Math.floor(p)-2,2);el.classList.add('float');
  document.body.appendChild(el);
  s.firstChild.style.opacity=.25;
  try{s.setPointerCapture(e.pointerId)}catch(_){}
  drag={i,el,target:null};lastKey='';
  move(e);
});
trayEl.addEventListener('pointermove',move);
trayEl.addEventListener('pointerup',end);
trayEl.addEventListener('pointercancel',e=>end(e,true));

function move(e){
  if(!drag)return;
  const {el}=drag,m=metrics(),pc=pieces[drag.i],T=TH();
  const left=e.clientX-el.offsetWidth/2;
  const top=e.clientY-el.offsetHeight/2-(e.pointerType==='mouse'?0:Math.max(48,m.p*0.9));
  el.style.left=left+'px';el.style.top=top+'px';
  const c=Math.round((left-m.x)/m.p),r=Math.round((top-m.y)/m.p);
  const ok=fits(pc.m,r,c);
  drag.target=ok?{r,c}:null;
  const key=ok?r+','+c:'';
  if(key===lastKey)return;lastKey=key;
  renderBoard();
  if(!ok)return;
  const tmp=board.map(row=>row.slice());
  pc.m.forEach((row,y)=>row.forEach((v,x)=>{if(v)tmp[r+y][c+x]=pc.c+1}));
  const {rows,cols}=fullLines(tmp);
  const ghost=idx=>{const el=cells[idx];el.classList.add('t-'+T.id,'g');el.style.setProperty('--col',T.cols[pc.c])};
  pc.m.forEach((row,y)=>row.forEach((v,x)=>{if(v)ghost((r+y)*N+c+x)}));
  rows.forEach(k=>{for(let x=0;x<N;x++){if(!board[k][x])ghost(k*N+x);cells[k*N+x].classList.add('w')}});
  cols.forEach(k=>{for(let y=0;y<N;y++){if(!board[y][k])ghost(y*N+k);cells[y*N+k].classList.add('w')}});
}
function end(e,cancel){
  if(!drag)return;
  const {i,el,target}=drag;drag=null;el.remove();
  if(target&&!cancel)place(i,target.r,target.c);
  else{renderBoard();renderTray()}
}

/* ---------- настройки ---------- */
const mq=matchMedia('(prefers-color-scheme: dark)');
function applyApp(){
  const v=S.app==='auto'?(mq.matches?'dark':'light'):S.app;
  document.documentElement.dataset.app=v;
  document.documentElement.dataset.bg=S.bg?'on':'off';
  [...$('segApp').children].forEach(b=>b.classList.toggle('on',b.dataset.v===S.app));
}
mq.addEventListener&&mq.addEventListener('change',applyApp);
function markTheme(){[...$('themeGrid').children].forEach(b=>b.classList.toggle('on',b.dataset.id===S.theme))}
function setBlockTheme(id){S.theme=id;save();markTheme();if(board){renderBoard();renderTray()}}
function buildGrid(){
  const g=$('themeGrid');
  THEMES.forEach(t=>{
    const b=document.createElement('button');b.className='tcard';b.dataset.id=t.id;
    const pv=document.createElement('div');pv.className='pv';
    t.cols.slice(0,6).forEach(col=>{const d=document.createElement('div');d.className='cell f t-'+t.id;d.style.setProperty('--col',col);pv.appendChild(d)});
    const n=document.createElement('span');n.textContent=t.name;
    b.append(pv,n);b.onclick=()=>setBlockTheme(t.id);g.appendChild(b);
  });
  markTheme();
}
[...$('segApp').children].forEach(b=>b.onclick=()=>{S.app=b.dataset.v;save();applyApp()});
const autoSw=$('autoSw');
const paintSw=()=>{autoSw.classList.toggle('on',S.auto);autoSw.setAttribute('aria-checked',S.auto)};
autoSw.onclick=()=>{S.auto=!S.auto;save();paintSw()};
const bgSw=$('bgSw');
const paintBg=()=>{bgSw.classList.toggle('on',S.bg);bgSw.setAttribute('aria-checked',S.bg)};
bgSw.onclick=()=>{S.bg=!S.bg;save();paintBg();applyApp()};
$('openS').onclick=()=>$('settings').classList.add('on');
$('closeS').onclick=()=>$('settings').classList.remove('on');
$('settings').addEventListener('pointerdown',e=>{if(e.target.id==='settings')$('settings').classList.remove('on')});

$('restart').onclick=start;$('again').onclick=start;
addEventListener('resize',()=>{if(pieces)renderTray()});
buildGrid();applyApp();paintSw();paintBg();/* ---------- аккаунты и рейтинг ---------- */
let committed=false,acct=null,online=false,authMode='login';
const NAME_RE=/^[\p{L}\p{N}_\- ]{3,16}$/u;
const key=n=>n.trim().toLowerCase();
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
function weak(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(16)}
async function hashPw(pw,salt){
  if(window.crypto&&crypto.subtle){
    const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    return hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:100000},k,256));
  }
  return weak(salt+pw);
}
const lu=()=>{try{return JSON.parse(localStorage.getItem('bb_users')||'{}')}catch(e){return {}}};
const saveLu=u=>{try{localStorage.setItem('bb_users',JSON.stringify(u))}catch(e){}};
const saveAcct=()=>{try{localStorage.setItem('bb_acct',JSON.stringify(acct))}catch(e){}};
const localRank=n=>{const a=Object.values(lu()).filter(x=>x.best>0).sort((a,b)=>b.best-a.best);const i=a.findIndex(x=>key(x.name)===key(n));return i<0?0:i+1};

async function http(path,opt={}){
  const r=await fetch(path,{method:opt.body?'POST':'GET',keepalive:!!opt.keep,
    headers:{'Content-Type':'application/json',...(acct&&acct.token?{Authorization:'Bearer '+acct.token}:{})},
    body:opt.body?JSON.stringify(opt.body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.error||'Ошибка сети');e.status=r.status;throw e}
  return j;
}
async function localReg(name,pw){
  const u=lu(),k=key(name);if(u[k])throw new Error('Этот никнейм уже занят');
  const salt=hex(crypto.getRandomValues(new Uint8Array(8)));
  u[k]={name,salt,hash:await hashPw(pw,salt),best:0,games:0};saveLu(u);return {name,best:0,games:0};
}
async function localLogin(name,pw){
  const x=lu()[key(name)];
  if(!x||x.hash!==await hashPw(pw,x.salt))throw new Error('Неверный никнейм или пароль');
  return {name:x.name,best:x.best,games:x.games};
}
/* отправка счёта в рейтинг (в конце партии, при рестарте и при закрытии вкладки) */
async function commit(){
  const sc=score;
  if(committed||!acct||!(sc>0))return null;
  committed=true;
  try{
    if(online){const r=await http('api/score',{body:{score:sc},keep:true});Object.assign(acct,r);saveAcct();return r}
    const u=lu(),x=u[key(acct.name)];
    if(x){x.games++;if(sc>x.best)x.best=sc;saveLu(u);acct.best=x.best;acct.games=x.games;acct.rank=localRank(acct.name);saveAcct();paintAcct();return {rank:acct.rank}}
  }catch(e){if(e.status===401){acct=null;saveAcct();paintAcct()}}
  return null;
}
async function refreshMe(){
  if(!acct)return;
  try{
    if(online)Object.assign(acct,await http('api/me'));
    else{const x=lu()[key(acct.name)];if(x){acct.best=x.best;acct.games=x.games;acct.rank=localRank(acct.name)}}
    saveAcct();paintAcct();
  }catch(e){if(e.status===401){acct=null;saveAcct();paintAcct()}}
}
function paintAcct(){
  $('chipName').textContent=acct?acct.name:'Войти';
  $('av').textContent=acct?[...acct.name][0].toUpperCase():'?';
  $('authIn').style.display=acct?'none':'block';
  $('authOut').style.display=acct?'block':'none';
  $('authT').textContent=acct?'Профиль':'Аккаунт';
  if(acct){$('pName').textContent=acct.name;$('pBest').textContent=acct.best||0;$('pGames').textContent=acct.games||0;$('pRank').textContent=acct.rank||'—'}
  const reg=authMode==='reg';
  [...$('authTabs').children].forEach(b=>b.classList.toggle('on',b.dataset.v===authMode));
  $('fPass2').style.display=reg?'block':'none';
  $('authGo').textContent=reg?'Создать аккаунт':'Войти';
  $('fPass').autocomplete=reg?'new-password':'current-password';
  $('modeHint').textContent=online?'Онлайн-режим: рейтинг общий для всех игроков сервера.'
    :'Офлайн-режим: аккаунты и рейтинг хранятся только на этом устройстве. Для общего рейтинга запустите сервер app.py (Flask), инструкция в начале файла app.py.';
  $('lbMode').textContent=online?'Общий рейтинг — лучшие результаты всех игроков.':'Рейтинг игроков этого устройства.';
}
function lbRow(x,me){
  const d=document.createElement('div');d.className='lbr'+(me?' me':'');
  const a=document.createElement('div');a.textContent=x.rank>=1&&x.rank<=3?['🥇','🥈','🥉'][x.rank-1]:'#'+x.rank;a.style.textAlign='center';
  const b=document.createElement('div');b.textContent=x.name;
  const s=document.createElement('small');s.textContent='игр: '+x.games;b.appendChild(s);
  const c=document.createElement('div');c.className='sc2';c.textContent=x.best;
  d.append(a,b,c);return d;
}
async function loadLB(){
  const list=$('lbList');list.textContent='Загрузка…';
  let top,me=null;
  try{
    if(online){const j=await http('api/top?limit=50');top=j.top;me=j.me}
    else{
      const all=Object.values(lu()).filter(x=>x.best>0).sort((a,b)=>b.best-a.best).map((x,i)=>({rank:i+1,name:x.name,best:x.best,games:x.games}));
      top=all.slice(0,50);if(acct)me=all.find(x=>key(x.name)===key(acct.name))||null;
    }
  }catch(e){list.textContent=e.message;return}
  list.textContent='';
  if(!top.length){list.textContent='Пока никого нет. Войдите, сыграйте партию и станьте первым!';return}
  top.forEach(x=>list.appendChild(lbRow(x,acct&&key(x.name)===key(acct.name))));
  if(me&&me.rank>top.length){const sep=document.createElement('div');sep.className='lbl';sep.textContent='…';sep.style.textAlign='center';list.append(sep,lbRow(me,true))}
}
async function initAcct(){
  if(location.protocol!=='file:')try{const r=await fetch('api/ping',{cache:'no-store'});online=r.ok&&(await r.json()).ok===true}catch(e){online=false}
  try{acct=JSON.parse(localStorage.getItem('bb_acct')||'null')}catch(e){acct=null}
  if(acct&&acct.mode!==(online?'online':'local'))acct=null;
  if(acct){best=Math.max(best,acct.best||0);$('best').textContent=best}
  paintAcct();refreshMe();
}
[...$('authTabs').children].forEach(b=>b.onclick=()=>{authMode=b.dataset.v;$('authErr').textContent='';paintAcct()});
$('authGo').onclick=async()=>{
  const name=$('fName').value.trim(),pw=$('fPass').value,err=$('authErr');err.textContent='';
  if(!NAME_RE.test(name)){err.textContent='Никнейм: 3–16 символов — буквы, цифры, пробел, _ и -';return}
  if(pw.length<6){err.textContent='Пароль — минимум 6 символов';return}
  if(authMode==='reg'&&pw!==$('fPass2').value){err.textContent='Пароли не совпадают';return}
  const btn=$('authGo');btn.disabled=true;
  try{
    const r=online?await http('api/'+(authMode==='reg'?'register':'login'),{body:{name,password:pw}})
      :await (authMode==='reg'?localReg:localLogin)(name,pw);
    acct={name:r.name,token:r.token,mode:online?'online':'local',best:r.best||0,games:r.games||0,rank:r.rank||0};
    saveAcct();best=Math.max(best,acct.best);$('best').textContent=best;
    $('fPass').value=$('fPass2').value='';paintAcct();refreshMe();
  }catch(e){err.textContent=e.message||'Ошибка'}
  btn.disabled=false;
};
['fName','fPass','fPass2'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')$('authGo').click()}));
$('logout').onclick=()=>{acct=null;authMode='login';saveAcct();paintAcct()};
$('chip').onclick=()=>{paintAcct();$('authM').classList.add('on');refreshMe()};
const openLB=()=>{$('lbM').classList.add('on');loadLB()};
$('openLB').onclick=openLB;$('goLB').onclick=openLB;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('on'));
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('pointerdown',e=>{if(e.target===m)m.classList.remove('on')}));
addEventListener('pagehide',()=>{if(!over)commit()});

start();initAcct();
</script>
